name: Release Windows Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv & install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Run tests before packaging
        shell: pwsh
        run: .\.venv\Scripts\pytest.exe -v

      - name: Build standalone Windows bundle
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Archive & generate SHA256 checksum
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "maew-usage-$tag-windows-x64.zip"
          Compress-Archive -Path "dist\maew-usage\*" -DestinationPath $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content -Encoding utf8 "SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            maew-usage-*-windows-x64.zip
            SHA256SUMS.txt
